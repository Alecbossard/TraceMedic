name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: python scripts/import_demo.py --workflow v1
      - run: python scripts/import_demo.py --workflow v2
      - name: Inspect real saved trace in browser (no new inference)
        run: |
          python -m tracemedic.cli serve > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8000/api/incidents && break; sleep 1; done
          node frontend/scripts/browser-qa.mjs --replay
          node frontend/scripts/browser-v2.mjs --replay
